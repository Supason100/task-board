  'bag repair': '👜',
  'catering': '🍽️', 'photography': '📸', 'videography': '🎥',
  'event planning': '🎉', 'dj services': '🎧', 'mc/anchoring': '🎤',
  'decoration': '🎈',
  'tutoring': '📚', 'music lessons': '🎵', 'language lessons': '🗣️',
  'computer training': '⌨️',
  'fitness training': '💪', 'nursing/caregiving': '🩺', 'physiotherapy': '🧘',
  'graphic design': '🖌️', 'web design/development': '🌐', 'accounting': '📊',
  'legal services': '⚖️', 'writing/editing': '✍️',
  'other': '📌'
};

 async function loadTasks() {
  const category = document.getElementById('filterCategory').value;
  const url = category ? `/tasks?category=${encodeURIComponent(category)}` : '/tasks';
  const res = await fetch(url);
  const tasks = await res.json();
  taskList.innerHTML = '';
  tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = 'task';
        div.innerHTML = `
    <span class="task-icon">${categoryIcons[t.category] || '📌'}</span><strong class="category-tag" onclick="filterByCategory('${t.category}')">${t.category}</strong> — ${t.location}<br>
  ${t.landmark ? `<em>Meetup landmark: ${t.landmark}</em><br>` : ''}
  ${t.description}<br>
  <em>Posted by ${t.name}, ${t.phone}</em><br>
  <strong>Status: ${t.status}</strong><br>
  ${t.status === 'open' ? `<button onclick="markTaken(${t.id})">Mark as Taken</button>` : ''}
  <button onclick='editTask(${JSON.stringify(t)})'>Edit</button>
  <button onclick="deleteTask(${t.id})">Delete</button>
`;
    taskList.appendChild(div);
  });
}
function filterByCategory(category) {
  document.getElementById('filterCategory').value = category;
  loadTasks();
  document.getElementById('filterCategory').scrollIntoView({ behavior: 'smooth' });
}
let editingId = null;

function editTask(t) {
  editingId = t.id;
  document.getElementById('name').value = t.name;
  document.getElementById('phone').value = t.phone;
  document.getElementById('category').value = t.category;
  document.getElementById('description').value = t.description;
  document.getElementById('location').value = t.location;
  document.getElementById('landmark').value = t.landmark;
  document.querySelector('#taskForm button[type="submit"]').textContent = 'Update Task';
  window.scrollTo(0, 0);
}
async function markTaken(id) {
  await fetch(`/tasks/${id}/taken`, { method: 'POST' });
  loadTasks();
}

async function deleteTask(id) {
  await fetch(`/tasks/${id}`, { method: 'DELETE' });
  loadTasks();
}


    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const task = {
  name: document.getElementById('name').value,
  phone: document.getElementById('phone').value,
  category: document.getElementById('category').value,
  description: document.getElementById('description').value,
  location: document.getElementById('location').value,
  landmark: document.getElementById('landmark').value,
};

      if (editingId) {
        await fetch(`/tasks/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task),
        });
        editingId = null;
        document.querySelector('#taskForm button[type="submit"]').textContent = 'Post Task';
      } else {
        await fetch('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task),
        });
      }

      form.reset();
      loadTasks();
    });

    loadTasks();
    document.getElementById('filterCategory').addEventListener('change', loadTasks);
  </script>
